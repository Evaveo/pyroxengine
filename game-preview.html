<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0d0f12;color:#d6d9de;
    font-family:"Segoe UI",system-ui,sans-serif;}
  #rj-view{position:fixed;inset:0;}
  #rj-view canvas{display:block;}
  #rj-ui{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6;}
  #rj-ui .ui-button{pointer-events:auto;cursor:pointer;font:inherit;}
  #rj-loading{position:fixed;inset:0;background:#0d0f12;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:10;}
  #rj-loading h1{font-size:22px;font-weight:600;}
  #rj-bar{width:min(420px,80vw);height:4px;background:#23272e;border-radius:2px;overflow:hidden;}
  #rj-bar::after{content:"";display:block;height:100%;width:40%;background:#5aa9e6;
    border-radius:2px;animation:rj-va 1.1s ease-in-out infinite alternate;}
  @keyframes rj-va{from{margin-left:0}to{margin-left:60%}}
  #rj-loading-txt{font-size:12.5px;color:#8a8f98;}
  #rj-hud{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:none;
    background:rgba(29,32,38,.92);border:1px solid #31363f;border-radius:8px;
    padding:8px 16px;font-size:13px;z-index:5;max-width:80vw;}
  #rj-error{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:none;
    background:#3a1518;border:1px solid #e06c75;color:#ffb3b8;border-radius:8px;
    padding:8px 16px;font-size:13px;z-index:20;max-width:90vw;}
  #rj-full-screen{position:fixed;top:12px;right:12px;z-index:5;background:rgba(29,32,38,.85);
    border:1px solid #31363f;color:#d6d9de;border-radius:8px;padding:6px 12px;
    cursor:pointer;font-size:12.5px;}
  #rj-full-screen:hover{border-color:#5aa9e6;color:#5aa9e6;}
</style>

<div id="rj-view"></div>

<!-- Données du projet : capturées par l'éditeur (window.opener) juste avant l'ouverture de
     cet tab, exactement comme data.js dans un build exporté. Script non-defer, placé
     avant les scripts runtime, pour être en place avant qu'ils lisent window.GAME_DATA. -->
<script>
  // window.parent en plus de window.opener : la meme page sert d'apercu dans un ONGLET (open
// par le bouton Jouer, d'ou opener) et dans un CADRE invisible de l'editeur, d'ou un agent la
// fait tourner pour mesurer ce qu'elle produit. Dans un cadre, opener est nul et parent est
// l'editeur. Sans cette seconde source, la page se chargeait sans donnees et rendait un ecran
// noir — ce qu'un agent aurait lu comme « le game ne marche pas ».
window.GAME_DATA = (window.opener && window.opener.PREVIEW_GAME_DATA)
                  || (window.parent !== window && window.parent.PREVIEW_GAME_DATA)
                  || null;
</script>

}}
</script>
